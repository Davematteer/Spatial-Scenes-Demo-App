version: '3.8'

services:

  # 2. Backend Pipeline Service (Hono + Bun Runtime)
  backend:
    build:
      context: .
      target: backend-runtime
      network: host 
    container_name: hono_backend
    expose:
      - "3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ccmb_transactions
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # 3. Frontend Production Distribution (Nginx)
  frontend:
    build:
      context: .
      target: frontend-runtime
      network: host 
    container_name: frontend_app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf 
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:

volumes:
  db_data: 