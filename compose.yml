services:

  # Backend (Hono + Bun)
  backend:
    build:
      context: .
      target: backend-runtime
      network: host 
    container_name: hono_backend
    expose:
      - "3000"
    networks:
      - app_network

  # Frontend (static build served by Nginx)
  frontend:
    build:
      context: .
      target: frontend-runtime
      network: host 
    container_name: frontend_app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf 
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
