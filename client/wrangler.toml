name = "spatial-scenes"
main = "worker/index.ts"
compatibility_date = "2026-07-16"
compatibility_flags = [ "nodejs_compat" ]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the posts API runs the Worker; everything else is served as static files.
run_worker_first = [ "/api/*" ]

# User-posted spatial scenes. Create once with:
#   bunx wrangler r2 bucket create spatial-scenes-uploads
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "spatial-scenes-uploads"

# Anyone can post, so cap it at 5 posts per minute per IP.
[[ratelimits]]
name = "POST_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
